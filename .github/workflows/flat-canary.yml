name: flat-canary
on:
  # Main trigger: cron-job.org calls workflow_dispatch at 01:00 Madrid
  # (midnight in the Canary Islands). GitHub's schedule lags hours behind,
  # so it is only a fallback (02:17 Madrid in summer, 01:17 in winter).
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      # From 20:15 Madrid ESIOS already serves the next day's PVPC, which must
      # not reach the Canary Islands page before their midnight (01:00 Madrid).
      # Applies to every trigger, so a misconfigured cron-job.org job cannot
      # publish it early either.
      - name: Skip runs between 20:00 and 01:00 Madrid
        id: gate
        run: |
          hour=$(TZ=Europe/Madrid date +%H)
          if [ "$hour" -ge 20 ] || [ "$hour" -lt 1 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Get current date
        id: date
        run: |
          echo "date_tomorrow=$(date -d "tomorrow" +'%d-%m-%Y')" >> $GITHUB_OUTPUT
      - name: Setup deno
        uses: denoland/setup-deno@main
        with:
          deno-version: v1.x
      - name: Check out repo
        uses: actions/checkout@v3
      - name: Flat Data
        if: steps.gate.outputs.skip != 'true'
        uses: githubocto/flat@3.4.0
        with:
          http_url: https://api.esios.ree.es/archives/70/download_json
          downloaded_filename: public/data/price.json
          authorization: ${{ secrets.API_KEY }}
          postprocess: canary.js
