name: flat
on:
  # Main trigger: cron-job.org calls workflow_dispatch at 00:00 Madrid.
  # GitHub's schedule lags hours behind, so it is only a fallback
  # (01:07 Madrid in summer, 00:07 in winter). update_create_datasets.js
  # takes the day from the ESIOS file and skips days already in the history,
  # so a second run changes nothing.
  schedule:
    - cron: '7 23 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: |
          echo "date_tomorrow=$(date -d "tomorrow" +'%d-%m-%Y')" >> $GITHUB_OUTPUT
      - name: Setup deno
        uses: denoland/setup-deno@main
        with:
          deno-version: v1.x
      - name: Check out repo
        uses: actions/checkout@v3
      - name: Flat Data
        uses: githubocto/flat@3.4.0
        with:
          http_url: https://api.esios.ree.es/archives/70/download_json
          downloaded_filename: public/data/price.json
          authorization: ${{ secrets.API_KEY }}
          postprocess: update_create_datasets.js
