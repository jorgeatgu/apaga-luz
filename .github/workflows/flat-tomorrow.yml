name: flat-tomorrow
on:
  # GitHub delays scheduled runs by hours at times; several slots make sure
  # tomorrow's PVPC lands soon after ESIOS publishes it (20:15 Madrid) and
  # before midnight in Madrid. Until then ESIOS still serves today's PVPC,
  # which is already in tomorrow_price.json, so Flat has nothing to commit.
  schedule:
    - cron: 37 18 * * *
    - cron: 22 19 * * *
    - cron: 7 20 * * *
  workflow_dispatch:
concurrency:
  group: flat-tomorrow
jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: |
          echo "date_tomorrow=$(date -d "tomorrow" +'%d-%m-%Y')" >> $GITHUB_OUTPUT
      - name: Setup deno
        uses: denoland/setup-deno@main
        with:
          deno-version: v1.x
      - name: Check out repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Flat Data
        uses: githubocto/flat@3.4.0
        with:
          http_url: https://api.esios.ree.es/archives/70/download_json
          downloaded_filename: public/data/price.json
          authorization: ${{ secrets.API_KEY }}
          postprocess: tomorrow.js
