name: flat-tomorrow
on:
  # Main trigger: cron-job.org calls workflow_dispatch at 20:15 Madrid.
  # GitHub's schedule lags hours behind, so it is only a fallback
  # (22:07 Madrid in summer, 21:07 in winter), skipped if it starts after
  # midnight in Madrid, when tomorrow's PVPC has already become today's.
  schedule:
    - cron: 7 20 * * *
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Skip late fallback runs
        id: gate
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$(TZ=Europe/Madrid date +%H)" -lt 20 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Get current date
        id: date
        run: |
          echo "date_tomorrow=$(date -d "tomorrow" +'%d-%m-%Y')" >> $GITHUB_OUTPUT
      - name: Setup deno
        uses: denoland/setup-deno@main
        with:
          deno-version: v1.x
      - name: Check out repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Flat Data
        if: steps.gate.outputs.skip != 'true'
        uses: githubocto/flat@3.4.0
        with:
          http_url: https://api.esios.ree.es/archives/70/download_json
          downloaded_filename: public/data/price.json
          authorization: ${{ secrets.API_KEY }}
          postprocess: tomorrow.js
