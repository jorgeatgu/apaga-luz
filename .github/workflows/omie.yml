name: flat-omie
on:
  # Main trigger: cron-job.org calls workflow_dispatch at 13:30 Madrid.
  # GitHub's schedule lags hours behind, so it is only a fallback
  # (16:17 Madrid in summer, 15:17 in winter). A second run finds the same
  # file and Flat does not commit.
  schedule:
    - cron: 17 14 * * *
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date -d 'tomorrow' +%Y%m%d)"
      - name: Setup deno
        uses: denoland/setup-deno@main
        with:
          deno-version: "1.8.2"
      - name: Check out repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Flat Data
        uses: githubocto/flat@3.4.0
        with:
          http_url: https://www.omie.es/es/file-download?parents=marginalpdbc&filename=marginalpdbc_${{ steps.date.outputs.date }}.1
          downloaded_filename: public/data/omie_prices.json
          postprocess: omie_dataset.js
