name: flat-omie
on:
  # GitHub delays scheduled runs by hours at times; several slots make sure
  # tomorrow's file lands soon after OMIE publishes it (~13:00 Madrid).
  # Before that OMIE answers 404 and Flat fails without committing; after the
  # first success the file does not change and Flat does not commit again.
  schedule:
    - cron: 17 11 * * *
    - cron: 15 12 * * *
    - cron: 17 13 * * *
    - cron: 17 14 * * *
  workflow_dispatch:
concurrency:
  group: flat-omie
jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date -d 'tomorrow' +%Y%m%d)"
      - name: Setup deno
        uses: denoland/setup-deno@main
        with:
          deno-version: "1.8.2"
      - name: Check out repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Flat Data
        uses: githubocto/flat@3.4.0
        with:
          http_url: https://www.omie.es/es/file-download?parents=marginalpdbc&filename=marginalpdbc_${{ steps.date.outputs.date }}.1
          downloaded_filename: public/data/omie_prices.json
          postprocess: omie_dataset.js
